<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VorzePiston Funscript Player</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px;text-align:center}
.box{max-width:820px;margin:auto;background:#fff;padding:24px;border-radius:15px}
button{font-size:17px;padding:12px 18px;margin:5px;border:0;border-radius:10px;cursor:pointer}
.connect{background:#222;color:#fff}.play{background:#1976d2;color:#fff}
.pause{background:#f57c00;color:#fff}.stop{background:#d32f2f;color:#fff}
.seekbtn{background:#555;color:#fff}
input[type=file]{margin:15px 0;font-size:16px;max-width:100%}
input[type=range]{width:100%}
#status{background:#eee;padding:12px;border-radius:10px;margin:15px 0;white-space:pre-wrap}
#info,#detail{text-align:left;background:#fafafa;padding:12px;border-radius:10px;margin-top:10px;white-space:pre-wrap}
#time{font-size:19px;margin:12px}
#bar{height:14px;background:#ddd;border-radius:7px;overflow:hidden}
#fill{height:100%;width:0;background:#1976d2}
#log{height:220px;background:#111;color:#00ff00;text-align:left;overflow:auto;padding:12px;white-space:pre-wrap;box-sizing:border-box;border-radius:10px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h1>VorzePiston Funscript Player</h1>

<button class="connect" id="connect">VorzePistonに接続</button>

<!-- acceptを指定しない。iPhone/Bluefyで.funscriptがグレーになる問題を回避 -->
<br><input type="file" id="file">
<div id="info">ファイル未選択</div>

<div id="status">未接続</div>
<div id="detail">接続先: なし</div>

<div id="time">00:00.000 / 00:00.000</div>
<input type="range" id="seek" min="0" max="0" value="0" step="1">

<div>
<button class="seekbtn" id="back">⏪ 10秒</button>
<button class="play" id="play">▶ 再生</button>
<button class="pause" id="pause">⏸ 一時停止</button>
<button class="stop" id="stop">⏹ 停止</button>
<button class="seekbtn" id="forward">10秒 ⏩</button>
</div>

<div id="bar"><div id="fill"></div></div>
<p id="actionInfo">アクション: -</p>

<h3>ログ</h3>
<div id="log"></div>
</div>

<script>
const SERVICE_UUID="40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID="40ee2222-63ec-4b7f-8ce7-712efd55b90e";

let device=null,server=null,service=null,characteristic=null;
let actions=[],duration=0,currentTime=0;
let playing=false,playStartedAt=0,playBaseTime=0;
let uiTimer=null,sendTimer=null,lastSentPosition=null,lastActionIndex=-1;
let sending=false,pendingPosition=null;

const $=id=>document.getElementById(id);

function log(s){
 const t=new Date().toLocaleTimeString();
 $("log").textContent+=`[${t}] ${s}\n`;
 $("log").scrollTop=$("log").scrollHeight;
}
function status(s){$("status").textContent=s;log(s)}
function fmt(ms){
 ms=Math.max(0,ms||0);let x=Math.floor(ms/1000);
 let m=Math.floor(x/60),s=x%60,mi=Math.floor(ms%1000);
 return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(mi).padStart(3,"0")}`;
}
function updateUI(){
 $("seek").max=duration||0;
 $("seek").value=Math.min(currentTime,duration||0);
 $("time").textContent=`${fmt(currentTime)} / ${fmt(duration)}`;
 $("fill").style.width=duration?`${Math.min(100,currentTime/duration*100)}%`:"0%";
}
function findIndex(t){
 let lo=0,hi=actions.length-1,ans=-1;
 while(lo<=hi){
  const mid=(lo+hi)>>1;
  if(actions[mid].at<=t){ans=mid;lo=mid+1}else hi=mid-1;
 }
 return ans;
}

/* ここはPCで確認済みのVorzePiston送信形式を維持 */
async function rawWrite(pos){
 if(!characteristic)return false;
 const p=Math.max(0,Math.min(100,Math.round(pos)));
 const data=new Uint8Array([0x03,0x01,p]);
 try{
  await characteristic.writeValue(data);
  log(`送信成功: 03 01 ${p.toString(16).padStart(2,"0")} pos=${p}`);
  return true;
 }catch(e){
  log(`送信失敗: ${e.name} / ${e.message}`);
  return false;
 }
}

/*
 * 送信を再生タイミングと分離。
 * writeValueの約70ms待ちで再生自体が遅れるのを防ぐ。
 * Bluetooth送信中に新しい位置が来たら、古い位置を捨てて最新値だけ送る。
 */
async function requestPosition(pos){
 pendingPosition=Math.max(0,Math.min(100,Math.round(pos)));
 if(sending)return;
 sending=true;
 try{
  while(pendingPosition!==null){
   const p=pendingPosition;
   pendingPosition=null;
   if(p===lastSentPosition)continue;
   await rawWrite(p);
   lastSentPosition=p;
  }
 }finally{
  sending=false;
 }
}

async function connectPiston(){
 try{
  log("Bluetooth機器の選択を開始");
  device=await navigator.bluetooth.requestDevice({
   filters:[{name:"VorzePiston"}],
   optionalServices:[SERVICE_UUID]
  });
  log(`選択された機器: ${device.name}`);
  server=await device.gatt.connect();
  log("GATT接続成功");
  service=await server.getPrimaryService(SERVICE_UUID);
  log("サービス取得成功");
  characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
  log("Characteristic取得成功");
  log(`write=${!!characteristic.properties.write}, writeWithoutResponse=${!!characteristic.properties.writeWithoutResponse}`);
  $("detail").textContent=
   `接続先: ${device.name}\nService UUID: ${SERVICE_UUID}\nCharacteristic UUID: ${CHARACTERISTIC_UUID}`;
  status("接続準備完了");
  device.addEventListener("gattserverdisconnected",()=>{
   characteristic=null;playing=false;clearInterval(uiTimer);clearInterval(sendTimer);
   status("Bluetooth切断");
  });
 }catch(e){
  log(`ERROR: ${e.name} / ${e.message}`);
  status("接続失敗");
 }
}
$("connect").onclick=async()=>{
 if(!navigator.bluetooth){alert("Web Bluetooth非対応です。iPhoneではBluefyを使用してください。");return}
 await connectPiston();
};

/* iPhone/Bluefy用。acceptを使わず、JavaScriptでJSONとして判定 */
$("file").addEventListener("change",async e=>{
 const file=e.target.files&&e.target.files[0];
 if(!file)return;
 log(`ファイル読み込み: ${file.name}`);
 try{
  const text=await file.text();
  const data=JSON.parse(text);
  if(!Array.isArray(data.actions))throw new Error("actionsが見つかりません");
  actions=data.actions
   .filter(a=>a&&Number.isFinite(Number(a.at))&&Number.isFinite(Number(a.pos)))
   .map(a=>({at:Number(a.at),pos:Math.max(0,Math.min(100,Number(a.pos)))}))
   .sort((a,b)=>a.at-b.at);
  duration=actions.length?actions[actions.length-1].at:0;
  currentTime=0;lastActionIndex=-1;lastSentPosition=null;
  $("info").textContent=`ファイル: ${file.name}\nアクション数: ${actions.length}\n最終時刻: ${fmt(duration)}`;
  updateUI();
  log("Funscript読み込み成功");
  log(`アクション数: ${actions.length}`);
  log(`最終時刻: ${duration} ms`);
 }catch(e){
  $("info").textContent="読み込み失敗";
  log(`Funscript読み込み失敗: ${e.message}`);
  alert("Funscriptを読み込めませんでした。");
 }
});

function startLoops(){
 clearInterval(uiTimer);clearInterval(sendTimer);
 /*
  * 再生時計はBluetoothとは独立して動かす。
  * 10ms間隔でFunscript上の現在位置を確認する。
  */
 uiTimer=setInterval(()=>{
  if(!playing)return;
  currentTime=playBaseTime+(performance.now()-playStartedAt);
  if(currentTime>=duration){
   currentTime=duration;
   updateUI();
   stopPlayback();
   return;
  }
  updateUI();

  const idx=findIndex(currentTime);
  if(idx>=0 && idx!==lastActionIndex){
   lastActionIndex=idx;
   const a=actions[idx];
   requestPosition(a.pos);
   $("actionInfo").textContent=`アクション: ${idx+1} / ${actions.length}   位置: ${a.pos}   時刻: ${fmt(a.at)}`;
  }
 },10);
}

function startPlayback(){
 if(!actions.length){alert("先にFunscriptファイルを選択してください。");return}
 if(!characteristic){alert("先にVorzePistonへ接続してください。");return}
 if(currentTime>=duration)currentTime=0;
 playing=true;
 playBaseTime=currentTime;
 playStartedAt=performance.now();
 log(`再生開始: ${fmt(currentTime)}`);
 startLoops();
}
function pausePlayback(){
 if(!playing)return;
 currentTime=playBaseTime+(performance.now()-playStartedAt);
 playing=false;
 clearInterval(uiTimer);
 updateUI();
 log(`一時停止: ${fmt(currentTime)}`);
}
async function stopPlayback(){
 playing=false;clearInterval(uiTimer);
 currentTime=0;lastActionIndex=-1;updateUI();
 if(characteristic)await requestPosition(0);
 log("停止");
}

$("play").onclick=startPlayback;
$("pause").onclick=pausePlayback;
$("stop").onclick=stopPlayback;

$("back").onclick=()=>{
 const was=playing;if(was)pausePlayback();
 currentTime=Math.max(0,currentTime-10000);
 lastActionIndex=findIndex(currentTime)-1;updateUI();
 log(`10秒戻る: ${fmt(currentTime)}`);
 if(was)startPlayback();
};
$("forward").onclick=()=>{
 const was=playing;if(was)pausePlayback();
 currentTime=Math.min(duration,currentTime+10000);
 lastActionIndex=findIndex(currentTime)-1;updateUI();
 log(`10秒進む: ${fmt(currentTime)}`);
 if(was)startPlayback();
};
$("seek").oninput=()=>{
 const was=playing;if(was)pausePlayback();
 currentTime=Number($("seek").value);
 lastActionIndex=findIndex(currentTime)-1;
 updateUI();
 if(was)startPlayback();
};
updateUI();
</script>
</body>
</html>
