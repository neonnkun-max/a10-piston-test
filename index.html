<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VorzePiston Video Sync Player</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:16px;text-align:center}
main{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:15px}
button{font-size:16px;padding:11px 16px;margin:5px;border:0;border-radius:10px}
.connect{background:#222;color:#fff}.sync{background:#1976d2;color:#fff}.stop{background:#d32f2f;color:#fff}
input[type=file]{font-size:15px;max-width:100%;margin:10px 0}
video{width:100%;max-height:55vh;background:#000;border-radius:10px;margin-top:10px}
#status,#info,#action{background:#eee;padding:10px;border-radius:10px;margin:10px 0;white-space:pre-wrap}
#log{height:220px;overflow:auto;background:#111;color:#0f0;text-align:left;padding:10px;border-radius:10px;white-space:pre-wrap;font:12px monospace}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
label{display:block;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>VorzePiston Video Sync Player</h1>

<div id="status">未接続</div>
<button id="connect" class="connect">VorzePistonに接続</button>

<h2>動画</h2>
<input id="videoFile" type="file" accept="video/*">
<video id="video" controls playsinline preload="metadata"></video>

<h2>Funscript</h2>
<!-- iPhone/Bluefyで.funscriptを選択できるようacceptを付けない -->
<input id="scriptFile" type="file">
<div id="info">Funscript未選択</div>

<div class="row">
<button id="syncOn" class="sync">同期ON</button>
<button id="syncOff">同期OFF</button>
<button id="stopPiston" class="stop">Piston停止</button>
</div>

<div id="action">アクション: -</div>

<h3>ログ</h3>
<div id="log"></div>
</main>

<script>
const SERVICE_UUID="40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID="40ee2222-63ec-4b7f-8ce7-712efd55b90e";
const DEVICE_ID=0x03;

let device=null, characteristic=null;
let actions=[], duration=0;
let syncEnabled=true;
let lastActionIndex=-1;
let writeChain=Promise.resolve();
let videoUrl=null;

const $=id=>document.getElementById(id);
const log=s=>{
 const e=$("log");
 e.textContent+="["+new Date().toLocaleTimeString()+"] "+s+"\n";
 e.scrollTop=e.scrollHeight;
};
const fmt=ms=>{
 ms=Math.max(0,Math.round(ms||0));
 const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000), x=ms%1000;
 return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(x).padStart(3,"0");
};

function findFirstAtOrAfter(t){
 let lo=0,hi=actions.length;
 while(lo<hi){
  const mid=(lo+hi)>>1;
  if(actions[mid].at<t)lo=mid+1; else hi=mid;
 }
 return lo;
}

function pistonPosition(pos){
 return Math.max(0,Math.min(200,Math.round(Number(pos)*2)));
}

function calcSpeed(prevPos,nextPos,dt){
 const distance=Math.abs(nextPos-prevPos);
 if(distance<=0)return 100;
 dt=Math.max(20,dt);
 const scaled=200*dt/distance;
 let speed=Math.pow(scaled/6658,-1.21);
 return Math.max(1,Math.min(100,Math.round(speed)));
}

async function writeCommand(position,speed){
 if(!characteristic)return;
 position=Math.max(0,Math.min(200,Math.round(position)));
 speed=Math.max(0,Math.min(100,Math.round(speed)));
 const packet=new Uint8Array([DEVICE_ID,position,speed]);
 await characteristic.writeValue(packet);
 log("送信 position="+position+" speed="+speed+
     " [03 "+position.toString(16).padStart(2,"0")+" "+
     speed.toString(16).padStart(2,"0")+"]");
}

function queueCommand(position,speed){
 writeChain=writeChain.then(()=>writeCommand(position,speed)).catch(e=>{
  log("送信ERROR: "+e.name+" / "+e.message);
 });
 return writeChain;
}

async function connect(){
 try{
  log("Bluetooth機器の選択を開始");
  device=await navigator.bluetooth.requestDevice({
   filters:[{name:"VorzePiston"}],
   optionalServices:[SERVICE_UUID]
  });
  log("選択された機器: "+device.name);
  const server=await device.gatt.connect();
  log("GATT接続成功");
  const service=await server.getPrimaryService(SERVICE_UUID);
  log("サービス取得成功");
  characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
  log("Characteristic取得成功");
  log("write="+!!characteristic.properties.write+
      " writeWithoutResponse="+!!characteristic.properties.writeWithoutResponse);
  $("status").textContent="接続成功";
 }catch(e){
  $("status").textContent="接続エラー";
  log("接続ERROR: "+e.name+" / "+e.message);
 }
}

$("connect").onclick=connect;

$("videoFile").onchange=e=>{
 const f=e.target.files&&e.target.files[0];
 if(!f)return;
 if(videoUrl)URL.revokeObjectURL(videoUrl);
 videoUrl=URL.createObjectURL(f);
 $("video").src=videoUrl;
 log("動画読み込み: "+f.name);
};

$("scriptFile").onchange=async e=>{
 const f=e.target.files&&e.target.files[0];
 if(!f)return;
 try{
  const data=JSON.parse(await f.text());
  if(!Array.isArray(data.actions))throw new Error("actionsがありません");
  actions=data.actions
   .filter(a=>Number.isFinite(Number(a.at))&&Number.isFinite(Number(a.pos)))
   .map(a=>({at:Number(a.at),pos:Math.max(0,Math.min(100,Number(a.pos)))}))
   .sort((a,b)=>a.at-b.at);
  if(!actions.length)throw new Error("有効なactionがありません");
  duration=actions[actions.length-1].at;
  lastActionIndex=-1;
  $("info").textContent=
   "ファイル: "+f.name+"\n"+
   "アクション数: "+actions.length+"\n"+
   "再生時間: "+fmt(duration);
  log("Funscript読み込み成功");
 }catch(e){
  $("info").textContent="読み込み失敗";
  log("読み込みERROR: "+e.message);
 }
};

function processVideoTime(){
 if(!syncEnabled || !characteristic || !actions.length)return;

 const t=$("video").currentTime*1000;
 const idx=findFirstAtOrAfter(t);

 // まだ次のactionに到達していない場合は直前actionを基準にする
 let useIndex=Math.max(0,idx-1);

 if(useIndex!==lastActionIndex){
  lastActionIndex=useIndex;

  const a=actions[useIndex];
  const prev=useIndex>0?actions[useIndex-1]:a;

  const p1=pistonPosition(prev.pos);
  const p2=pistonPosition(a.pos);
  const dt=useIndex>0?Math.max(20,a.at-prev.at):1000;
  const speed=calcSpeed(p1,p2,dt);

  queueCommand(p2,speed);

  $("action").textContent=
   "アクション: "+(useIndex+1)+" / "+actions.length+
   "  at="+fmt(a.at)+
   "  pos="+a.pos+
   " → piston="+p2+
   "  speed="+speed;
 }
}

const video=$("video");

video.addEventListener("timeupdate",processVideoTime);

video.addEventListener("seeking",()=>{
 if(!actions.length)return;
 const t=video.currentTime*1000;
 lastActionIndex=findFirstAtOrAfter(t)-2;
 log("動画シーク: "+fmt(t));
});

video.addEventListener("play",()=>{
 log("動画再生開始: "+fmt(video.currentTime*1000));
});

video.addEventListener("pause",()=>{
 log("動画一時停止: "+fmt(video.currentTime*1000));
});

video.addEventListener("ended",async()=>{
 log("動画終了");
 if(characteristic)await queueCommand(0,100);
});

$("syncOn").onclick=()=>{
 syncEnabled=true;
 lastActionIndex=-1;
 $("status").textContent=characteristic?"接続成功 / 同期ON":"未接続 / 同期ON";
 log("同期ON");
 processVideoTime();
};

$("syncOff").onclick=()=>{
 syncEnabled=false;
 $("status").textContent=characteristic?"接続成功 / 同期OFF":"未接続 / 同期OFF";
 log("同期OFF");
};

$("stopPiston").onclick=async()=>{
 if(characteristic)await queueCommand(0,100);
 log("Piston停止");
};
</script>
</body>
</html>
