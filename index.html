<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VorzePiston Step4</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 30px 15px;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

button {
    font-size: 18px;
    padding: 14px 22px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.connect {
    background: #222;
    color: white;
}

.forward {
    background: #1976d2;
    color: white;
}

.reverse {
    background: #7b1fa2;
    color: white;
}

.stop {
    background: #d32f2f;
    color: white;
}

input[type="range"] {
    width: 90%;
    margin: 20px 0;
}

.speed {
    font-size: 28px;
    font-weight: bold;
}

#status {
    padding: 12px;
    background: #eee;
    border-radius: 10px;
    margin: 15px 0;
}

#log {
    height: 250px;
    overflow-y: auto;
    background: #111;
    color: #00ff00;
    text-align: left;
    padding: 12px;
    white-space: pre-wrap;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>VorzePiston Step4</h1>

<div id="status">
未接続
</div>

<button class="connect" id="connect">
VorzePistonに接続
</button>

<hr>

<h2>速度</h2>

<div class="speed">
<span id="speedValue">20</span>
</div>

<input
    type="range"
    id="speed"
    min="0"
    max="100"
    value="20"
>

<br>

<button class="forward" id="forward">
正方向
</button>

<button class="reverse" id="reverse">
逆方向
</button>

<br>

<button class="stop" id="stop">
停止
</button>

<h2>通信ログ</h2>

<div id="log"></div>

</div>

<script>

const SERVICE_UUID =
"40ee1111-63ec-4b7f-8ce7-712efd55b90e";

const CHARACTERISTIC_UUID =
"40ee2222-63ec-4b7f-8ce7-712efd55b90e";

let device = null;
let server = null;
let characteristic = null;

const logElement =
document.getElementById("log");

function log(message) {

    logElement.textContent +=
        "[" +
        new Date().toLocaleTimeString() +
        "] " +
        message +
        "\n";

    logElement.scrollTop =
        logElement.scrollHeight;
}

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;

}


/* =========================
   Bluetooth接続
========================= */

async function connect() {

    try {

        log("Bluetooth機器の選択を開始");

        device =
        await navigator.bluetooth.requestDevice({

            filters: [
                {
                    name: "VorzePiston"
                }
            ],

            optionalServices: [
                SERVICE_UUID
            ]

        });

        log(
            "選択された機器: "
            + device.name
        );

        server =
        await device.gatt.connect();

        log("GATT接続成功");

        const service =
        await server.getPrimaryService(
            SERVICE_UUID
        );

        log("サービス取得成功");

        characteristic =
        await service.getCharacteristic(
            CHARACTERISTIC_UUID
        );

        log(
            "Characteristic取得成功"
        );

        setStatus(
            "VorzePiston 接続中"
        );

        log(
            "接続準備完了"
        );

    }

    catch(error) {

        log(
            "ERROR: "
            + error.name
            + " / "
            + error.message
        );

        setStatus(
            "接続エラー"
        );

    }

}


/* =========================
   コマンド送信
========================= */

async function sendCommand(
    value
) {

    if (!characteristic) {

        log(
            "VorzePistonに接続してください"
        );

        return;

    }

    value =
        Math.max(
            0,
            Math.min(
                100,
                Number(value)
            )
        );

    const packet =
    new Uint8Array([
        0x03,
        0x01,
        value
    ]);

    try {

        if (
            characteristic
            .properties
            .writeWithoutResponse
        ) {

            await characteristic
                .writeValueWithoutResponse(
                    packet
                );

        }

        else {

            await characteristic
                .writeValue(
                    packet
                );

        }

        log(
            "送信: "
            +
            Array.from(packet)
                .map(
                    x =>
                    "0x"
                    +
                    x
                    .toString(16)
                    .padStart(2, "0")
                )
                .join(" ")
        );

    }

    catch(error) {

        log(
            "送信ERROR: "
            + error.name
            + " / "
            + error.message
        );

    }

}


/* =========================
   速度スライダー
========================= */

const speedSlider =
document.getElementById("speed");

const speedValue =
document.getElementById("speedValue");

speedSlider.oninput =
function() {

    speedValue.textContent =
        this.value;

};


/* =========================
   ボタン
========================= */

document
.getElementById("connect")
.onclick =
connect;


document
.getElementById("forward")
.onclick =
function() {

    sendCommand(
        speedSlider.value
    );

};


document
.getElementById("reverse")
.onclick =
function() {

    /*
       逆方向フラグ
       0x80を付加
    */

    const speed =
        Number(
            speedSlider.value
        );

    sendCommand(
        0x80 | speed
    );

};


document
.getElementById("stop")
.onclick =
function() {

    sendCommand(0);

};

</script>

</body>
</html>
