<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VorzePiston iPhone BLE Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:18px;text-align:center}
main{max-width:720px;margin:auto;background:#fff;padding:22px;border-radius:15px}
button{font-size:17px;padding:12px 18px;margin:5px;border:0;border-radius:10px}
.connect{background:#222;color:#fff}.test{background:#1976d2;color:#fff}.stop{background:#d32f2f;color:#fff}
input{font-size:16px;padding:8px;width:90px}
#status{background:#eee;padding:12px;border-radius:10px;margin:12px 0}
#props{background:#fafafa;padding:12px;border-radius:10px;text-align:left;white-space:pre-wrap}
#log{height:320px;overflow:auto;background:#111;color:#0f0;text-align:left;padding:10px;border-radius:10px;white-space:pre-wrap;font:12px monospace}
</style>
</head>
<body>
<main>
<h1>VorzePiston iPhone BLE Test</h1>

<div id="status">未接続</div>
<button id="connect" class="connect">VorzePistonに接続</button>

<h2>Characteristic情報</h2>
<div id="props">未取得</div>

<h2>単発テスト</h2>
<p>位置 <input id="pos" type="number" min="0" max="200" value="100"></p>
<p>速度 <input id="speed" type="number" min="0" max="100" value="70"></p>

<button id="send" class="test">この位置へ1回送信</button>

<h2>固定テスト</h2>
<button class="test fixed" data-pos="0" data-speed="70">位置0</button>
<button class="test fixed" data-pos="100" data-speed="70">位置100</button>
<button class="test fixed" data-pos="200" data-speed="70">位置200</button>

<h2>往復テスト</h2>
<button id="roundtrip" class="test">0 → 200 → 0</button>
<button id="stop" class="stop">停止</button>

<h2>ログ</h2>
<div id="log"></div>
</main>

<script>
const SERVICE_UUID="40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID="40ee2222-63ec-4b7f-8ce7-712efd55b90e";
const DEVICE_ID=0x03;

let device=null;
let characteristic=null;

const $=id=>document.getElementById(id);
function log(s){
  const e=$("log");
  e.textContent+="["+new Date().toLocaleTimeString()+"] "+s+"\n";
  e.scrollTop=e.scrollHeight;
}
function status(s){$("status").textContent=s;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function hex(arr){return Array.from(arr).map(x=>x.toString(16).padStart(2,"0")).join(" ");}

async function connect(){
  try{
    if(!navigator.bluetooth){
      status("Web Bluetooth非対応");
      log("navigator.bluetooth がありません。Bluefyで開いてください。");
      return;
    }

    log("Bluetooth機器の選択を開始");

    device=await navigator.bluetooth.requestDevice({
      filters:[{name:"VorzePiston"}],
      optionalServices:[SERVICE_UUID]
    });

    log("選択された機器: "+device.name);

    const server=await device.gatt.connect();
    log("GATT接続成功");

    const service=await server.getPrimaryService(SERVICE_UUID);
    log("サービス取得成功");

    characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    log("Characteristic取得成功");

    const p=characteristic.properties;
    $("props").textContent=
      "write: "+!!p.write+"\n"+
      "writeWithoutResponse: "+!!p.writeWithoutResponse+"\n"+
      "read: "+!!p.read+"\n"+
      "notify: "+!!p.notify+"\n"+
      "indicate: "+!!p.indicate;

    log("write="+!!p.write);
    log("writeWithoutResponse="+!!p.writeWithoutResponse);

    status("接続成功");
  }catch(e){
    status("接続エラー");
    log("ERROR: "+e.name+" / "+e.message);
  }
}

async function sendCommand(position,speed){
  if(!characteristic){
    log("先に接続してください");
    return false;
  }

  position=Math.max(0,Math.min(200,Math.round(Number(position)||0)));
  speed=Math.max(0,Math.min(100,Math.round(Number(speed)||0)));

  const packet=new Uint8Array([DEVICE_ID,position,speed]);

  try{
    const t0=performance.now();

    // iPhone診断のため、write=trueなら必ずWrite With Responseを使う
    if(characteristic.properties.write){
      await characteristic.writeValue(packet);
      log(
        "送信成功(write) "+
        "position="+position+
        " speed="+speed+
        " ["+hex(packet)+"] "+
        (performance.now()-t0).toFixed(1)+"ms"
      );
      return true;
    }

    if(characteristic.properties.writeWithoutResponse){
      await characteristic.writeValueWithoutResponse(packet);
      log(
        "送信成功(writeWithoutResponse) "+
        "position="+position+
        " speed="+speed+
        " ["+hex(packet)+"] "+
        (performance.now()-t0).toFixed(1)+"ms"
      );
      return true;
    }

    log("書き込み可能Propertyがありません");
    return false;

  }catch(e){
    log("送信ERROR: "+e.name+" / "+e.message);
    return false;
  }
}

$("connect").onclick=connect;

$("send").onclick=()=>{
  sendCommand($("pos").value,$("speed").value);
};

document.querySelectorAll(".fixed").forEach(btn=>{
  btn.onclick=()=>sendCommand(
    Number(btn.dataset.pos),
    Number(btn.dataset.speed)
  );
});

$("roundtrip").onclick=async()=>{
  log("往復テスト開始");
  await sendCommand(0,70);
  await sleep(1500);
  await sendCommand(200,70);
  await sleep(1500);
  await sendCommand(0,70);
  log("往復テスト終了");
};

$("stop").onclick=async()=>{
  await sendCommand(0,100);
  log("停止コマンド送信");
};
</script>
</body>
</html>
