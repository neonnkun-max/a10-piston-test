<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VorzePiston Step3</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    margin-top:40px;
}

button{
    font-size:18px;
    padding:14px 24px;
    margin:6px;
}

.test{
    background:#222;
    color:white;
}

.stop{
    background:#c62828;
    color:white;
}

#log{
    width:90%;
    max-width:700px;
    height:350px;
    margin:20px auto;
    border:1px solid #ccc;
    background:white;
    text-align:left;
    overflow:auto;
    padding:10px;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<h1>VorzePiston Step3</h1>

<button id="connect">
VorzePistonに接続
</button>

<br>

<button class="test" id="test">
低速テスト送信
</button>

<button class="stop" id="stop">
停止
</button>

<div id="log"></div>

<script>

const SERVICE_UUID =
"40ee1111-63ec-4b7f-8ce7-712efd55b90e";

const CHARACTERISTIC_UUID =
"40ee2222-63ec-4b7f-8ce7-712efd55b90e";

let device = null;
let server = null;
let characteristic = null;


function log(text){

    document.getElementById("log").textContent
    += text + "\n";

}


async function connect(){

    try{

        log("Bluetooth機器の選択を開始");

        device =
        await navigator.bluetooth.requestDevice({

            filters:[
                {
                    name:"VorzePiston"
                }
            ],

            optionalServices:[
                SERVICE_UUID
            ]

        });

        log(
            "選択された機器: "
            + device.name
        );


        server =
        await device.gatt.connect();

        log("GATT接続成功");


        const service =
        await server.getPrimaryService(
            SERVICE_UUID
        );

        log("サービス取得成功");


        characteristic =
        await service.getCharacteristic(
            CHARACTERISTIC_UUID
        );

        log(
            "Characteristic取得成功"
        );

        log("");
        log("接続準備完了");

    }

    catch(error){

        log("ERROR");
        log(error.name);
        log(error.message);

    }

}


async function sendCommand(value){

    if(!characteristic){

        log("先にVorzePistonへ接続してください");

        return;

    }


    const packet =
    new Uint8Array([
        0x03,
        0x01,
        value
    ]);


    log(
        "送信: "
        +
        Array.from(packet)
        .map(
            x =>
            "0x"
            +
            x
            .toString(16)
            .padStart(2,"0")
        )
        .join(" ")
    );


    try{

        if(
            "writeValueWithoutResponse"
            in characteristic
        ){

            await characteristic
            .writeValueWithoutResponse(
                packet
            );

        }

        else{

            await characteristic
            .writeValue(
                packet
            );

        }


        log("送信成功");

    }

    catch(error){

        log("送信ERROR");

        log(error.name);

        log(error.message);

    }

}


document
.getElementById("connect")
.onclick =
connect;


document
.getElementById("test")
.onclick =
async function(){

    /*
     * Piston SA
     * Device ID = 0x03
     *
     * まず初期化値 0x00
     */
    await sendCommand(0x00);

    await new Promise(
        resolve =>
        setTimeout(resolve,300)
    );


    /*
     * 低い値を1回送信
     */
    await sendCommand(0x14);

};


document
.getElementById("stop")
.onclick =
async function(){

    /*
     * 0x00 = 停止候補
     */
    await sendCommand(0x00);

};

</script>

</body>
</html>
