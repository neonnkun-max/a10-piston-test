<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VorzePiston Funscript Player</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;padding:20px;text-align:center}
.box{max-width:820px;margin:auto;background:#fff;padding:24px;border-radius:15px}
button{font-size:17px;padding:12px 18px;margin:5px;border:0;border-radius:10px;cursor:pointer}
.connect{background:#222;color:#fff}.play{background:#1976d2;color:#fff}
.pause{background:#f57c00;color:#fff}.stop{background:#d32f2f;color:#fff}.seekbtn{background:#555;color:#fff}
input[type=file]{margin:15px 0;font-size:16px}
input[type=range]{width:100%}
#status{background:#eee;padding:12px;border-radius:10px;margin:15px 0}
#info,#detail{text-align:left;background:#fafafa;padding:12px;border-radius:10px;margin-top:10px;white-space:pre-wrap}
#time{font-size:19px;margin:12px}
#bar{height:14px;background:#ddd;border-radius:7px;overflow:hidden}
#fill{height:100%;width:0;background:#1976d2}
.big{font-size:25px;font-weight:bold}
#log{height:260px;background:#111;color:#00ff00;text-align:left;overflow:auto;padding:12px;white-space:pre-wrap;border-radius:10px;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h1>VorzePiston Funscript Player</h1>

<div id="status">未接続</div>
<button class="connect" id="connect">VorzePistonに接続</button>

<hr>

<h2>Funscript</h2>
<input type="file" id="file" accept=".funscript,.json,application/json">
<div id="info">ファイル未選択</div>

<hr>

<div class="big">現在位置: <span id="pos">-</span></div>
<div id="detail">アクション: - / -</div>

<div id="time">00:00.000 / 00:00.000</div>
<input type="range" id="seek" min="0" max="0" value="0" step="1">
<div id="bar"><div id="fill"></div></div>

<button class="seekbtn" id="back">⏪ 10秒</button>
<button class="play" id="play">▶ 再生</button>
<button class="pause" id="pause">⏸ 一時停止</button>
<button class="stop" id="stop">⏹ 停止</button>
<button class="seekbtn" id="forward">10秒 ⏩</button>

<h2>ログ</h2>
<div id="log"></div>
</div>

<script>
const SERVICE_UUID="40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID="40ee2222-63ec-4b7f-8ce7-712efd55b90e";
const DEVICE_ID=0x03;

let device=null, characteristic=null;
let actions=[];
let playing=false;
let currentTime=0;
let currentIndex=0;
let raf=null;
let lastFrame=0;
let seekDragging=false;
let lastCommandTime=-Infinity;
let lastPosition=null;
let lastSpeed=null;

const $=id=>document.getElementById(id);

function log(s){
  const e=$("log");
  e.textContent+="["+new Date().toLocaleTimeString()+"] "+s+"\n";
  e.scrollTop=e.scrollHeight;
}
function status(s){$("status").textContent=s;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function fmt(ms){
  ms=Math.max(0,Math.round(ms));
  const m=Math.floor(ms/60000);
  const s=Math.floor(ms%60000/1000);
  const x=ms%1000;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(x).padStart(3,"0");
}
function total(){return actions.length?actions[actions.length-1].at:0;}

async function connect(){
  try{
    log("Bluetooth機器の選択を開始");
    device=await navigator.bluetooth.requestDevice({
      filters:[{name:"VorzePiston"}],
      optionalServices:[SERVICE_UUID]
    });
    log("選択された機器: "+device.name);
    const server=await device.gatt.connect();
    log("GATT接続成功");
    const service=await server.getPrimaryService(SERVICE_UUID);
    log("サービス取得成功");
    characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    log("Characteristic取得成功");
    log("write="+!!characteristic.properties.write);
    status("VorzePiston 接続成功");
  }catch(e){
    log("接続ERROR: "+e.name+" / "+e.message);
    status("接続エラー");
  }
}

/*
 VorzePiston command confirmed by the preceding hardware test:
  byte 0 = 0x03
  byte 1 = position 0..200
  byte 2 = speed 0..100
*/
async function sendCommand(position,speed,force=false){
  if(!characteristic)return false;

  position=Math.max(0,Math.min(200,Math.round(position)));
  speed=Math.max(0,Math.min(100,Math.round(speed)));

  if(!force && position===lastPosition && speed===lastSpeed)return true;

  const packet=new Uint8Array([DEVICE_ID,position,speed]);

  try{
    if(characteristic.properties.writeWithoutResponse){
      await characteristic.writeValueWithoutResponse(packet);
    }else if(characteristic.properties.write){
      await characteristic.writeValue(packet);
    }else{
      log("書き込み権限がありません");
      return false;
    }

    lastPosition=position;
    lastSpeed=speed;
    lastCommandTime=performance.now();

    log("送信: position="+position+" speed="+speed+
        " [03 "+position.toString(16).padStart(2,"0")+" "+
        speed.toString(16).padStart(2,"0")+"]");

    return true;
  }catch(e){
    log("送信ERROR: "+e.name+" / "+e.message);
    return false;
  }
}

function posToPiston(pos){
  return Math.max(0,Math.min(200,Math.round(Number(pos)*2)));
}

/*
 Calculate a practical speed from distance and action interval.
 For very short intervals, cap at 100.
*/
function calcSpeed(distance,dt){
  distance=Math.abs(distance);
  if(distance<=0)return 0;
  dt=Math.max(20,dt);
  let duration=200*dt/distance;
  let speed=Math.pow(duration/6658,-1.21);
  return Math.max(1,Math.min(100,Math.round(speed)));
}

function findIndex(t){
  let lo=0,hi=actions.length;
  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(actions[mid].at<t)lo=mid+1;
    else hi=mid;
  }
  return lo;
}

function updateUI(){
  const t=Math.max(0,Math.min(currentTime,total()));
  $("time").textContent=fmt(t)+" / "+fmt(total());
  $("seek").max=String(total());
  if(!seekDragging)$("seek").value=String(Math.round(t));
  $("fill").style.width=(total()?t/total()*100:0)+"%";
  $("detail").textContent="アクション: "+Math.min(currentIndex,actions.length)+" / "+actions.length;
}

function positionAt(t){
  if(!actions.length)return null;
  const i=findIndex(t)-1;
  return actions[Math.max(0,Math.min(actions.length-1,i))];
}

async function applySeek(t){
  currentTime=Math.max(0,Math.min(Number(t)||0,total()));
  currentIndex=findIndex(currentTime);

  const a=positionAt(currentTime);
  if(a){
    $("pos").textContent=String(a.pos);
    const p=posToPiston(a.pos);
    await sendCommand(p,70,true);
  }
  updateUI();
  log("シーク: "+fmt(currentTime));
}

async function frame(now){
  if(!playing)return;

  if(!lastFrame)lastFrame=now;
  const delta=now-lastFrame;
  lastFrame=now;

  currentTime+=delta;

  while(currentIndex<actions.length && actions[currentIndex].at<=currentTime){
    const a=actions[currentIndex];
    const prev=currentIndex>0?actions[currentIndex-1]:a;
    const dt=Math.max(20,a.at-prev.at);
    const distance=Math.abs(Number(a.pos)-Number(prev.pos))*2;
    const speed=calcSpeed(distance,dt);
    const pistonPos=posToPiston(a.pos);

    $("pos").textContent=String(a.pos);

    await sendCommand(pistonPos,speed);

    currentIndex++;
  }

  updateUI();

  if(currentTime>=total()){
    currentTime=total();
    playing=false;
    cancelAnimationFrame(raf);
    raf=null;
    lastFrame=0;
    await sendCommand(0,100,true);
    log("再生完了");
    status("再生完了");
    updateUI();
    return;
  }

  raf=requestAnimationFrame(frame);
}

function play(){
  if(!characteristic){
    log("先にVorzePistonへ接続してください");
    return;
  }
  if(!actions.length){
    log("先にFunscriptを読み込んでください");
    return;
  }
  if(playing)return;

  if(currentTime>=total()){
    currentTime=0;
    currentIndex=0;
  }else{
    currentIndex=findIndex(currentTime);
  }

  playing=true;
  lastFrame=0;
  status("再生中");
  log("再生開始: "+fmt(currentTime));
  raf=requestAnimationFrame(frame);
}

function pause(){
  if(!playing)return;
  playing=false;
  cancelAnimationFrame(raf);
  raf=null;
  lastFrame=0;
  status("一時停止");
  log("一時停止: "+fmt(currentTime));
}

async function stopPlayback(){
  playing=false;
  cancelAnimationFrame(raf);
  raf=null;
  lastFrame=0;
  currentTime=0;
  currentIndex=0;
  lastPosition=null;
  lastSpeed=null;

  await sendCommand(0,100,true);
  status(actions.length?"停止":"Funscript未読み込み");
  updateUI();
  log("停止");
}

$("file").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;

  try{
    await stopPlayback();

    log("ファイル読み込み: "+file.name);
    const data=JSON.parse(await file.text());

    if(!Array.isArray(data.actions))throw new Error("actions配列がありません");

    actions=data.actions
      .filter(a=>Number.isFinite(Number(a.at))&&Number.isFinite(Number(a.pos)))
      .map(a=>({at:Number(a.at),pos:Math.max(0,Math.min(100,Number(a.pos)))}))
      .sort((a,b)=>a.at-b.at);

    if(!actions.length)throw new Error("有効なactionsがありません");

    currentTime=0;
    currentIndex=0;

    $("info").textContent=
      "ファイル: "+file.name+
      "\nアクション数: "+actions.length+
      "\n再生時間: "+fmt(total())+
      "\nPiston位置: Funscript 0～100 → Piston 0～200";

    $("pos").textContent=String(actions[0].pos);
    updateUI();

    log("Funscript読み込み成功");
    log("アクション数: "+actions.length);
    log("最終時刻: "+actions[actions.length-1].at+" ms");
    status("Funscript読み込み完了");
  }catch(e){
    actions=[];
    updateUI();
    log("読み込みERROR: "+e.message);
    status("読み込みエラー");
  }
});

$("seek").addEventListener("input",()=>{
  seekDragging=true;
  const t=Number($("seek").value);
  $("time").textContent=fmt(t)+" / "+fmt(total());
  $("fill").style.width=(total()?t/total()*100:0)+"%";
});

$("seek").addEventListener("change",async()=>{
  seekDragging=false;
  const wasPlaying=playing;
  if(wasPlaying)pause();
  await applySeek(Number($("seek").value));
  if(wasPlaying)play();
});

$("back").addEventListener("click",async()=>{
  const wasPlaying=playing;
  if(wasPlaying)pause();
  await applySeek(currentTime-10000);
  if(wasPlaying)play();
});

$("forward").addEventListener("click",async()=>{
  const wasPlaying=playing;
  if(wasPlaying)pause();
  await applySeek(currentTime+10000);
  if(wasPlaying)play();
});

$("connect").addEventListener("click",connect);
$("play").addEventListener("click",play);
$("pause").addEventListener("click",pause);
$("stop").addEventListener("click",stopPlayback);

updateUI();
</script>
</body>
</html>
