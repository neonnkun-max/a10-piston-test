<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VorzePiston Funscript Player</title>
<style>
  body{font-family:Arial,sans-serif;background:#f5f5f5;padding:20px;text-align:center;margin:0}
  .box{max-width:820px;margin:auto;background:#fff;padding:24px;border-radius:15px;box-sizing:border-box}
  button{font-size:17px;padding:12px 18px;margin:5px;border:0;border-radius:10px;cursor:pointer}
  .connect{background:#222;color:#fff}
  .play{background:#1976d2;color:#fff}
  .pause{background:#f57c00;color:#fff}
  .stop{background:#d32f2f;color:#fff}
  .seekbtn{background:#555;color:#fff}
  input[type=file]{margin:15px 0;font-size:16px;max-width:100%}
  input[type=range]{width:100%}
  #status{background:#eee;padding:12px;border-radius:10px;margin:15px 0;white-space:pre-wrap}
  #info,#detail{text-align:left;background:#fafafa;padding:12px;border-radius:10px;margin-top:10px}
  #time{font-size:19px;margin:12px}
  #bar{height:14px;background:#ddd;border-radius:7px;overflow:hidden}
  #fill{height:100%;width:0;background:#1976d2}
  #log{height:220px;background:#111;color:#00ff00;text-align:left;overflow:auto;padding:12px;white-space:pre-wrap;box-sizing:border-box;border-radius:10px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h1>VorzePiston Funscript Player</h1>

<button class="connect" id="connect">VorzePistonに接続</button>
<br>

<!-- acceptを指定しないことでiPhone/Bluefyのファイル選択で
     .funscriptがグレーアウトする問題を回避 -->
<input type="file" id="file">
<div id="info">ファイル未選択</div>

<div id="status">未接続</div>

<div id="detail">接続先: なし<br>サービス: なし<br>Characteristic: なし</div>

<div id="time">00:00.000 / 00:00.000</div>
<input type="range" id="seek" min="0" max="0" value="0" step="1">

<div>
<button class="seekbtn" id="back">⏪ 10秒</button>
<button class="play" id="play">▶ 再生</button>
<button class="pause" id="pause">⏸ 一時停止</button>
<button class="stop" id="stop">⏹ 停止</button>
<button class="seekbtn" id="forward">10秒 ⏩</button>
</div>

<div id="bar"><div id="fill"></div></div>

<p id="actionInfo">アクション: -</p>

<h3>ログ</h3>
<div id="log"></div>
</div>

<script>
const SERVICE_UUID = "40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID = "40ee2222-63ec-4b7f-8ce7-712efd55b90e";

let device = null;
let server = null;
let service = null;
let characteristic = null;

let actions = [];
let duration = 0;
let playing = false;
let currentTime = 0;
let timer = null;
let lastActionIndex = -1;
let lastSendTime = 0;

const $ = id => document.getElementById(id);

function log(msg){
  const t = new Date().toLocaleTimeString();
  $("log").textContent += `[${t}] ${msg}\n`;
  $("log").scrollTop = $("log").scrollHeight;
}

function setStatus(msg){
  $("status").textContent = msg;
  log(msg);
}

function formatTime(ms){
  ms = Math.max(0, ms || 0);
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  const milli = Math.floor(ms % 1000).toString().padStart(3,"0");
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${milli}`;
}

function updateUI(){
  $("seek").max = duration || 0;
  $("seek").value = Math.min(currentTime, duration || 0);
  $("time").textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
  $("fill").style.width = duration ? `${Math.min(100,currentTime/duration*100)}%` : "0%";
}

function positionToByte(position){
  // Funscript 0-100 -> VorzePiston command byte 0-100.
  // 0x03 0x01 [position]
  return Math.max(0, Math.min(100, Math.round(Number(position) || 0)));
}

async function sendPosition(position){
  if(!characteristic){
    log("送信不可: VorzePiston未接続");
    return false;
  }

  const p = positionToByte(position);
  const data = new Uint8Array([0x03,0x01,p]);

  try{
    // このCharacteristicは write=true / writeWithoutResponse=false
    await characteristic.writeValue(data);
    lastSendTime = performance.now();
    log(`送信成功: 03 01 ${p.toString(16).padStart(2,"0")} (pos=${p})`);
    return true;
  }catch(e){
    log(`送信失敗: ${e.name} / ${e.message}`);
    return false;
  }
}

async function connectPiston(){
  try{
    log("Bluetooth機器の選択を開始");

    device = await navigator.bluetooth.requestDevice({
      filters: [{name:"VorzePiston"}],
      optionalServices: [SERVICE_UUID]
    });

    log(`選択された機器: ${device.name}`);

    server = await device.gatt.connect();
    log("GATT接続成功");

    service = await server.getPrimaryService(SERVICE_UUID);
    log(`サービス取得成功: ${SERVICE_UUID}`);

    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
    log(`Characteristic取得成功: ${CHARACTERISTIC_UUID}`);

    $("detail").innerHTML =
      `接続先: ${device.name || "VorzePiston"}<br>` +
      `サービス: ${SERVICE_UUID}<br>` +
      `Characteristic: ${CHARACTERISTIC_UUID}<br>` +
      `Properties: write=${!!characteristic.properties.write}, ` +
      `writeWithoutResponse=${!!characteristic.properties.writeWithoutResponse}`;

    setStatus("接続準備完了");

    if(device){
      device.addEventListener("gattserverdisconnected", ()=>{
        characteristic = null;
        setStatus("Bluetooth切断");
      });
    }

  }catch(e){
    log(`ERROR: ${e.name} / ${e.message}`);
    setStatus("接続失敗");
  }
}

$("connect").addEventListener("click", async ()=>{
  if(!navigator.bluetooth){
    alert("このブラウザはWeb Bluetoothに対応していません。iPhoneではBluefyを使用してください。");
    return;
  }
  await connectPiston();
});

/*
 * iPhone/Bluefy向けファイル読み込み。
 * accept属性を使わず、拡張子をJavaScript側で確認する。
 */
$("file").addEventListener("change", async e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  log(`ファイル選択: ${file.name}`);

  try{
    const text = await file.text();
    const data = JSON.parse(text);

    if(!Array.isArray(data.actions)){
      throw new Error("Funscriptのactionsが見つかりません");
    }

    actions = data.actions
      .filter(a => a && Number.isFinite(Number(a.at)) && Number.isFinite(Number(a.pos)))
      .map(a => ({
        at: Math.max(0, Number(a.at)),
        pos: Math.max(0, Math.min(100, Number(a.pos)))
      }))
      .sort((a,b)=>a.at-b.at);

    duration = actions.length ? actions[actions.length-1].at : 0;
    currentTime = 0;
    lastActionIndex = -1;

    $("info").textContent =
      `ファイル: ${file.name}\n` +
      `アクション数: ${actions.length}\n` +
      `最終時刻: ${formatTime(duration)}`;

    updateUI();
    log("Funscript読み込み成功");
    log(`アクション数: ${actions.length}`);
    log(`最終時刻: ${duration} ms`);

  }catch(e){
    $("info").textContent = "読み込み失敗";
    log(`Funscript読み込み失敗: ${e.message}`);
    alert("Funscriptを読み込めませんでした。\nJSON形式の.funscriptファイルを選択してください。");
  }
});

function findActionIndex(t){
  let lo=0, hi=actions.length-1, ans=-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(actions[mid].at<=t){
      ans=mid;
      lo=mid+1;
    }else{
      hi=mid-1;
    }
  }
  return ans;
}

async function processPlayback(){
  if(!playing) return;

  const idx = findActionIndex(currentTime);

  if(idx >= 0 && idx !== lastActionIndex){
    lastActionIndex = idx;
    const a = actions[idx];
    await sendPosition(a.pos);
    $("actionInfo").textContent =
      `アクション: ${idx+1} / ${actions.length}　位置: ${a.pos}　時刻: ${formatTime(a.at)}`;
  }

  updateUI();

  if(currentTime >= duration){
    stopPlayback();
    return;
  }

  currentTime += 20;
  timer = setTimeout(processPlayback,20);
}

function startPlayback(){
  if(!actions.length){
    alert("先にFunscriptファイルを選択してください。");
    return;
  }
  if(!characteristic){
    alert("先にVorzePistonへ接続してください。");
    return;
  }

  if(currentTime >= duration) currentTime = 0;

  playing = true;
  log(`再生開始: ${formatTime(currentTime)}`);
  clearTimeout(timer);
  processPlayback();
}

function pausePlayback(){
  if(!playing) return;
  playing = false;
  clearTimeout(timer);
  log(`一時停止: ${formatTime(currentTime)}`);
}

async function stopPlayback(){
  playing = false;
  clearTimeout(timer);
  currentTime = 0;
  lastActionIndex = -1;
  updateUI();

  if(characteristic){
    await sendPosition(0);
  }

  log("停止");
}

$("play").addEventListener("click", startPlayback);
$("pause").addEventListener("click", pausePlayback);
$("stop").addEventListener("click", stopPlayback);

$("back").addEventListener("click", ()=>{
  currentTime = Math.max(0,currentTime-10000);
  lastActionIndex = findActionIndex(currentTime)-1;
  updateUI();
  log(`10秒戻る: ${formatTime(currentTime)}`);
});

$("forward").addEventListener("click", ()=>{
  currentTime = Math.min(duration,currentTime+10000);
  lastActionIndex = findActionIndex(currentTime)-1;
  updateUI();
  log(`10秒進む: ${formatTime(currentTime)}`);
});

$("seek").addEventListener("input", ()=>{
  currentTime = Number($("seek").value);
  lastActionIndex = findActionIndex(currentTime)-1;
  updateUI();
});

updateUI();
</script>
</body>
</html>
