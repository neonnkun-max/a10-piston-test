<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VorzePiston Step4 改良版</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

button {
    font-size: 18px;
    padding: 14px 22px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.connect {
    background: #222;
    color: white;
}

.forward {
    background: #1976d2;
    color: white;
}

.reverse {
    background: #7b1fa2;
    color: white;
}

.stop {
    background: #d32f2f;
    color: white;
}

input[type="range"] {
    width: 90%;
}

.speed {
    font-size: 32px;
    font-weight: bold;
    margin: 15px;
}

#status {
    padding: 12px;
    background: #eee;
    border-radius: 10px;
    margin: 15px 0;
}

#log {
    height: 250px;
    overflow-y: auto;
    background: #111;
    color: #00ff00;
    text-align: left;
    padding: 12px;
    white-space: pre-wrap;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>VorzePiston Step4</h1>

<div id="status">未接続</div>

<button class="connect" id="connect">
VorzePistonに接続
</button>

<hr>

<h2>速度</h2>

<div class="speed">
<span id="speedValue">50</span>
</div>

<input
    type="range"
    id="speed"
    min="0"
    max="100"
    value="50"
>

<br>

<button class="forward" id="forward">
正方向
</button>

<button class="reverse" id="reverse">
逆方向
</button>

<br>

<button class="stop" id="stop">
停止
</button>

<h2>ログ</h2>

<div id="log"></div>

</div>

<script>

const SERVICE_UUID =
"40ee1111-63ec-4b7f-8ce7-712efd55b90e";

const CHARACTERISTIC_UUID =
"40ee2222-63ec-4b7f-8ce7-712efd55b90e";

let device = null;
let server = null;
let characteristic = null;

const logElement =
document.getElementById("log");

function log(message) {

    logElement.textContent +=
        "[" +
        new Date().toLocaleTimeString() +
        "] " +
        message +
        "\n";

    logElement.scrollTop =
        logElement.scrollHeight;
}

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;

}


/* =========================
   接続
========================= */

async function connect() {

    try {

        log("Bluetooth機器の選択を開始");

        device =
        await navigator.bluetooth.requestDevice({

            filters: [
                {
                    name: "VorzePiston"
                }
            ],

            optionalServices: [
                SERVICE_UUID
            ]

        });

        log(
            "選択された機器: "
            + device.name
        );

        server =
        await device.gatt.connect();

        log("GATT接続成功");

        const service =
        await server.getPrimaryService(
            SERVICE_UUID
        );

        log("サービス取得成功");

        characteristic =
        await service.getCharacteristic(
            CHARACTERISTIC_UUID
        );

        log("Characteristic取得成功");

        setStatus("接続成功");

    }

    catch(error) {

        log(
            "ERROR: "
            + error.name
            + " / "
            + error.message
        );

        setStatus("接続エラー");

    }

}


/* =========================
   Vorze Piston SA
   コマンド送信
========================= */

async function sendCommand(
    direction,
    speed
) {

    if (!characteristic) {

        log("先に接続してください");

        return;

    }

    speed = Number(speed);

    speed =
        Math.max(
            0,
            Math.min(
                100,
                speed
            )
        );


    /*
       Vorze Piston SA

       Byte 0 = 0x03
       Byte 1 = 0x01
       Byte 2 = direction + speed

       direction:
       0 = 正方向
       1 = 逆方向
    */

    let directionBit =
        direction ? 0x80 : 0x00;


    let thirdByte =
        directionBit | speed;


    const packet =
    new Uint8Array([
        0x03,
        0x01,
        thirdByte
    ]);


    try {

        if (
            characteristic.properties
            .writeWithoutResponse
        ) {

            await characteristic
                .writeValueWithoutResponse(
                    packet
                );

        }

        else {

            await characteristic
                .writeValue(
                    packet
                );

        }


        log(
            "送信: "
            +
            Array.from(packet)
                .map(
                    x =>
                    "0x"
                    +
                    x
                    .toString(16)
                    .padStart(2,"0")
                )
                .join(" ")
        );

    }

    catch(error) {

        log(
            "送信ERROR: "
            +
            error.name
            +
            " / "
            +
            error.message
        );

    }

}


/* =========================
   スライダー
========================= */

const speedSlider =
document.getElementById("speed");

const speedValue =
document.getElementById("speedValue");

speedSlider.addEventListener(
    "input",
    function() {

        speedValue.textContent =
            this.value;

    }
);


/* =========================
   ボタン
========================= */

document
.getElementById("connect")
.addEventListener(
    "click",
    connect
);


/* 正方向 */

document
.getElementById("forward")
.addEventListener(
    "click",
    function() {

        sendCommand(
            false,
            speedSlider.value
        );

    }
);


/* 逆方向 */

document
.getElementById("reverse")
.addEventListener(
    "click",
    function() {

        sendCommand(
            true,
            speedSlider.value
        );

    }
);


/* 停止 */

document
.getElementById("stop")
.addEventListener(
    "click",
    function() {

        sendCommand(
            false,
            0
        );

    }
);

</script>

</body>
</html>
