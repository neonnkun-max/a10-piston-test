<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VorzePiston Funscript Player iPhone</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:18px;text-align:center}
main{max-width:820px;margin:auto;background:#fff;padding:22px;border-radius:15px}
button{font-size:17px;padding:12px 17px;margin:5px;border:0;border-radius:10px}
.connect{background:#222;color:#fff}.play{background:#1976d2;color:#fff}.pause{background:#f57c00;color:#fff}.stop{background:#d32f2f;color:#fff}.seekbtn{background:#555;color:#fff}
input[type=file]{font-size:16px;max-width:100%;margin:12px 0}
input[type=range]{width:100%}
#status,#info,#action{background:#eee;padding:11px;border-radius:10px;margin:10px 0;white-space:pre-wrap}
#time{font-size:20px;margin:10px}
#log{height:260px;overflow:auto;background:#111;color:#0f0;text-align:left;padding:10px;white-space:pre-wrap;border-radius:10px;font:12px monospace}
</style>
</head>
<body><main>
<h1>VorzePiston Funscript Player</h1>
<button id="connect" class="connect">VorzePistonに接続</button><br>

<!-- iPhone/Bluefyで.funscriptを選択できるようacceptを付けない -->
<input id="file" type="file">
<div id="info">ファイル未選択</div>
<div id="status">未接続</div>

<div id="time">00:00.000 / 00:00.000</div>
<input id="seek" type="range" min="0" max="0" value="0" step="1">

<button id="back" class="seekbtn">⏪ 10秒</button>
<button id="play" class="play">▶ 再生</button>
<button id="pause" class="pause">⏸ 一時停止</button>
<button id="stop" class="stop">⏹ 停止</button>
<button id="forward" class="seekbtn">10秒 ⏩</button>

<div id="action">アクション: -</div>

<h3>ログ</h3>
<div id="log"></div>
</main>

<script>
const SERVICE_UUID="40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID="40ee2222-63ec-4b7f-8ce7-712efd55b90e";
const DEVICE_ID=0x03;

let device=null, characteristic=null;
let actions=[], duration=0;
let currentTime=0, currentIndex=0;
let playing=false, timer=null, startedAt=0, baseTime=0;
let writeChain=Promise.resolve();

const $=id=>document.getElementById(id);
const log=s=>{
 const e=$("log");
 e.textContent+="["+new Date().toLocaleTimeString()+"] "+s+"\n";
 e.scrollTop=e.scrollHeight;
};
const fmt=ms=>{
 ms=Math.max(0,Math.round(ms||0));
 const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),x=ms%1000;
 return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(x).padStart(3,"0");
};
function total(){return duration}
function updateUI(){
 $("time").textContent=fmt(currentTime)+" / "+fmt(duration);
 $("seek").max=duration;
 $("seek").value=Math.min(currentTime,duration);
}
function findFirstAtOrAfter(t){
 let lo=0,hi=actions.length;
 while(lo<hi){
  const mid=(lo+hi)>>1;
  if(actions[mid].at<t)lo=mid+1; else hi=mid;
 }
 return lo;
}

/* 実機で連続動作した形式: 03 [position 0..200] [speed 0..100] */
function calcSpeed(distance,dt){
 if(distance<=0)return 100;
 dt=Math.max(20,dt);
 const d=Math.min(Math.abs(distance),200);
 const scaled=200*dt/d;
 let speed=Math.pow(scaled/6658,-1.21);
 return Math.max(1,Math.min(100,Math.round(speed)));
}
async function writeCommand(position,speed){
 if(!characteristic)return;
 position=Math.max(0,Math.min(200,Math.round(position)));
 speed=Math.max(0,Math.min(100,Math.round(speed)));
 const packet=new Uint8Array([DEVICE_ID,position,speed]);
 await characteristic.writeValue(packet);
 log("送信 position="+position+" speed="+speed+
     " [03 "+position.toString(16).padStart(2,"0")+" "+speed.toString(16).padStart(2,"0")+"]");
}
/* write=trueのCharacteristicなので、書き込み同士が重ならないよう直列化 */
function queueCommand(position,speed){
 writeChain=writeChain.then(()=>writeCommand(position,speed)).catch(e=>{
  log("送信ERROR: "+e.name+" / "+e.message);
 });
 return writeChain;
}

$("connect").onclick=async()=>{
 try{
  log("Bluetooth機器の選択を開始");
  device=await navigator.bluetooth.requestDevice({
   filters:[{name:"VorzePiston"}],
   optionalServices:[SERVICE_UUID]
  });
  log("選択: "+device.name);
  const server=await device.gatt.connect();
  log("GATT接続成功");
  const service=await server.getPrimaryService(SERVICE_UUID);
  log("サービス取得成功");
  characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
  log("Characteristic取得成功");
  log("write="+!!characteristic.properties.write+
      " writeWithoutResponse="+!!characteristic.properties.writeWithoutResponse);
  $("status").textContent="接続成功";
 }catch(e){
  log("接続ERROR: "+e.name+" / "+e.message);
  $("status").textContent="接続失敗";
 }
};

$("file").onchange=async e=>{
 const f=e.target.files&&e.target.files[0];
 if(!f)return;
 try{
  const data=JSON.parse(await f.text());
  if(!Array.isArray(data.actions))throw new Error("actionsがありません");
  actions=data.actions
   .filter(a=>Number.isFinite(Number(a.at))&&Number.isFinite(Number(a.pos)))
   .map(a=>({at:Number(a.at),pos:Math.max(0,Math.min(100,Number(a.pos)))}))
   .sort((a,b)=>a.at-b.at);
  if(!actions.length)throw new Error("有効なactionがありません");
  duration=actions[actions.length-1].at;
  currentTime=0;currentIndex=0;
  $("info").textContent="ファイル: "+f.name+"\nアクション数: "+actions.length+"\n再生時間: "+fmt(duration);
  updateUI();
  log("Funscript読み込み成功: "+actions.length+" actions");
 }catch(e){
  log("読み込みERROR: "+e.message);
  $("info").textContent="読み込み失敗";
 }
};

function scheduleNext(){
 if(!playing)return;

 currentTime=Math.min(duration,baseTime+(performance.now()-startedAt));
 updateUI();

 /* 現在時刻までに到達したactionを順番に処理 */
 while(currentIndex<actions.length && actions[currentIndex].at<=currentTime){
  const a=actions[currentIndex];
  const prev=currentIndex>0?actions[currentIndex-1]:a;
  const pistonPos=Math.round(a.pos*2);       // 0..100 -> 0..200
  const prevPos=Math.round(prev.pos*2);
  const dt=currentIndex>0?Math.max(20,a.at-prev.at):1000;
  const speed=calcSpeed(Math.abs(pistonPos-prevPos),dt);

  queueCommand(pistonPos,speed);
  $("action").textContent=
    "アクション: "+(currentIndex+1)+" / "+actions.length+
    "  pos="+a.pos+" → piston="+pistonPos+
    "  speed="+speed;

  currentIndex++;
 }

 if(currentTime>=duration){
  playing=false;
  clearTimeout(timer);
  timer=null;
  log("再生完了");
  return;
 }

 timer=setTimeout(scheduleNext,10);
}

$("play").onclick=()=>{
 if(!characteristic){alert("先にVorzePistonへ接続してください。");return}
 if(!actions.length){alert("先にFunscriptを選択してください。");return}
 if(playing)return;
 if(currentTime>=duration)currentTime=0;

 currentIndex=findFirstAtOrAfter(currentTime);
 baseTime=currentTime;
 startedAt=performance.now();
 playing=true;
 log("再生開始: "+fmt(currentTime));
 scheduleNext();
};

$("pause").onclick=()=>{
 if(!playing)return;
 currentTime=Math.min(duration,baseTime+(performance.now()-startedAt));
 playing=false;
 clearTimeout(timer);timer=null;
 updateUI();
 log("一時停止: "+fmt(currentTime));
};

async function seekTo(t){
 const was=playing;
 if(was){
  currentTime=Math.min(duration,baseTime+(performance.now()-startedAt));
  playing=false;clearTimeout(timer);timer=null;
 }
 currentTime=Math.max(0,Math.min(duration,t));
 currentIndex=findFirstAtOrAfter(currentTime);
 updateUI();
 log("シーク: "+fmt(currentTime));
 if(was){
  baseTime=currentTime;startedAt=performance.now();playing=true;scheduleNext();
 }
}
$("back").onclick=()=>seekTo(currentTime-10000);
$("forward").onclick=()=>seekTo(currentTime+10000);
$("seek").onchange=()=>seekTo(Number($("seek").value));

$("stop").onclick=async()=>{
 playing=false;clearTimeout(timer);timer=null;
 currentTime=0;currentIndex=0;updateUI();
 /* 動作確認済みテストと同じ形式で端位置へ送る */
 if(characteristic)await queueCommand(0,100);
 log("停止");
};

updateUI();
</script>
</body>
</html>
