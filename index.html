<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A10 Piston SA BLE Explorer</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;margin:0;padding:20px;color:#111}.card{max-width:760px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}button{font-size:16px;padding:12px 16px;margin:4px;border:0;border-radius:10px;background:#ddd}button.primary{background:#111;color:#fff}#status{padding:12px;border-radius:10px;background:#eee;margin:12px 0;white-space:pre-wrap}pre{background:#111;color:#0f0;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow:auto}.note{font-size:13px;color:#555;line-height:1.5}</style></head><body><div class="card"><h1>A10 Piston SA BLE Explorer</h1><p class="note">A10 Piston SA（表示名がVorzePiston）のBluetooth GATTサービスとCharacteristicを調べる診断ページです。</p><div id="status">状態：未接続</div><button id="connect" class="primary">Bluetooth接続・サービス探索</button><button id="disconnect" disabled>切断</button><h2>探索結果</h2><pre id="result">まだ探索していません。</pre><h2>ログ</h2><pre id="log"></pre><p class="note">この版では実機を誤動作させないため、Characteristicへの書き込みは行いません。</p></div><script>
let device=null,server=null;
const $=id=>document.getElementById(id);
function log(x){$("log").textContent+="["+new Date().toLocaleTimeString()+"] "+x+"\n";$("log").scrollTop=$("log").scrollHeight;}
function status(x){$("status").textContent="状態："+x;}
function props(p){return Object.keys(p).filter(k=>p[k]).join(", ");}
async function connect(){
 if(!navigator.bluetooth){status("Web Bluetooth非対応");return;}
 try{
  $("result").textContent="";status("Bluetooth機器を選択してください…");log("Bluetooth機器の選択を開始");
  device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[]});
  log("選択された機器: "+(device.name||"(名前なし)"));device.addEventListener("gattserverdisconnected",()=>{status("切断されました");log("GATT切断");});
  status("GATT接続中…");server=await device.gatt.connect();log("GATT接続成功");status("サービス探索中…");
  let out="Device name: "+(device.name||"(なし)")+"\nDevice ID: "+device.id+"\n\n";let services=[];
  try{services=await server.getPrimaryServices();}catch(e){log("getPrimaryServices()失敗: "+e.name+" / "+e.message);}
  out+="Primary services found: "+services.length+"\n\n";
  if(!services.length){out+="【重要】接続は成功しましたが、サービス一覧を取得できませんでした。\nWeb Bluetoothでは、接続前に対象サービスUUIDをoptionalServicesへ指定する必要があります。\n次の版でA10/Vorze候補UUIDを追加して再接続します。\n";}
  for(const s of services){
   out+="SERVICE: "+s.uuid+"\n";
   try{const chars=await s.getCharacteristics();for(const c of chars){out+="  CHARACTERISTIC: "+c.uuid+"\n";out+="    properties: "+props(c.properties)+"\n";}}catch(e){out+="  characteristic error: "+e.message+"\n";}out+="\n";
  }
  $("result").textContent=out;status("探索完了");$("disconnect").disabled=false;
 }catch(e){status("エラー");log("ERROR: "+e.name+" / "+e.message);$("result").textContent="ERROR: "+e.name+" / "+e.message;}
}
function disconnect(){try{if(device&&device.gatt.connected)device.gatt.disconnect();}catch(e){log(e.message);}$("disconnect").disabled=true;status("未接続");}
$("connect").onclick=connect;$("disconnect").onclick=disconnect;
</script></body></html>
