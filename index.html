<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VorzePiston iPhone Funscript Player</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:18px;text-align:center}
main{max-width:820px;margin:auto;background:#fff;padding:22px;border-radius:15px}
button{font-size:17px;padding:12px 18px;margin:5px;border:0;border-radius:10px}
.connect{background:#222;color:#fff}.play{background:#1976d2;color:#fff}
.pause{background:#f57c00;color:#fff}.stop{background:#d32f2f;color:#fff}
.seekbtn{background:#555;color:#fff}
input[type=file]{font-size:16px;max-width:100%;margin:12px 0}
input[type=range]{width:100%}
#status,#info,#action{background:#eee;padding:11px;border-radius:10px;margin:10px 0;white-space:pre-wrap}
#time{font-size:20px;margin:10px}
#log{height:260px;overflow:auto;background:#111;color:#0f0;text-align:left;padding:10px;border-radius:10px;white-space:pre-wrap;font:12px monospace}
</style>
</head>
<body>
<main>
<h1>VorzePiston iPhone Funscript Player</h1>

<div id="status">未接続</div>
<button id="connect" class="connect">VorzePistonに接続</button>

<h2>Funscript</h2>
<!-- iPhone/Bluefyで.funscriptを選択できるようacceptを付けない -->
<input id="file" type="file">
<div id="info">ファイル未選択</div>

<h2>再生</h2>
<div id="time">00:00.000 / 00:00.000</div>
<input id="seek" type="range" min="0" max="0" value="0" step="1">

<button id="back" class="seekbtn">⏪ 10秒</button>
<button id="play" class="play">▶ 再生</button>
<button id="pause" class="pause">⏸ 一時停止</button>
<button id="stop" class="stop">⏹ 停止</button>
<button id="forward" class="seekbtn">10秒 ⏩</button>

<div id="action">アクション: -</div>

<h3>ログ</h3>
<div id="log"></div>
</main>

<script>
const SERVICE_UUID="40ee1111-63ec-4b7f-8ce7-712efd55b90e";
const CHARACTERISTIC_UUID="40ee2222-63ec-4b7f-8ce7-712efd55b90e";
const DEVICE_ID=0x03;

let device=null;
let characteristic=null;

let actions=[];
let duration=0;
let currentTime=0;
let currentIndex=0;

let playing=false;
let playStartWall=0;
let playStartScript=0;
let timer=null;

const $=id=>document.getElementById(id);

function log(s){
  const e=$("log");
  e.textContent+="["+new Date().toLocaleTimeString()+"] "+s+"\n";
  e.scrollTop=e.scrollHeight;
}

function fmt(ms){
  ms=Math.max(0,Math.round(ms||0));
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const x=ms%1000;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(x).padStart(3,"0");
}

function updateUI(){
  $("time").textContent=fmt(currentTime)+" / "+fmt(duration);
  $("seek").max=String(duration||0);
  $("seek").value=String(Math.min(currentTime,duration||0));
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

async function connect(){
  try{
    log("Bluetooth機器の選択を開始");

    device=await navigator.bluetooth.requestDevice({
      filters:[{name:"VorzePiston"}],
      optionalServices:[SERVICE_UUID]
    });

    log("選択された機器: "+device.name);

    const server=await device.gatt.connect();
    log("GATT接続成功");

    const service=await server.getPrimaryService(SERVICE_UUID);
    log("サービス取得成功");

    characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    log("Characteristic取得成功");

    log("write="+!!characteristic.properties.write);
    log("writeWithoutResponse="+!!characteristic.properties.writeWithoutResponse);

    $("status").textContent="接続成功";

  }catch(e){
    $("status").textContent="接続エラー";
    log("接続ERROR: "+e.name+" / "+e.message);
  }
}

/*
  iPhoneで実機動作確認済み:
  [0x03, position(0..200), speed(0..100)]
*/
async function sendCommand(position,speed){
  if(!characteristic){
    log("未接続");
    return false;
  }

  position=Math.max(0,Math.min(200,Math.round(position)));
  speed=Math.max(0,Math.min(100,Math.round(speed)));

  const packet=new Uint8Array([DEVICE_ID,position,speed]);

  try{
    await characteristic.writeValue(packet);

    log(
      "送信 position="+position+
      " speed="+speed+
      " [03 "+
      position.toString(16).padStart(2,"0")+" "+
      speed.toString(16).padStart(2,"0")+"]"
    );

    return true;
  }catch(e){
    log("送信ERROR: "+e.name+" / "+e.message);
    return false;
  }
}

function pistonPosition(pos){
  return Math.max(0,Math.min(200,Math.round(Number(pos)*2)));
}

function calcSpeed(prevPos,nextPos,dt){
  const distance=Math.abs(nextPos-prevPos);

  if(distance<=0)return 100;

  dt=Math.max(20,dt);

  const scaled=200*dt/distance;

  let speed=Math.pow(scaled/6658,-1.21);

  return Math.max(1,Math.min(100,Math.round(speed)));
}

function findIndexAtOrAfter(t){
  let lo=0,hi=actions.length;

  while(lo<hi){
    const mid=(lo+hi)>>1;

    if(actions[mid].at<t){
      lo=mid+1;
    }else{
      hi=mid;
    }
  }

  return lo;
}

async function playbackTick(){
  if(!playing)return;

  currentTime=
    playStartScript+
    (performance.now()-playStartWall);

  while(
    currentIndex<actions.length &&
    actions[currentIndex].at<=currentTime
  ){
    const a=actions[currentIndex];

    const prev=
      currentIndex>0
      ? actions[currentIndex-1]
      : a;

    const p1=pistonPosition(prev.pos);
    const p2=pistonPosition(a.pos);

    const dt=
      currentIndex>0
      ? Math.max(20,a.at-prev.at)
      : 1000;

    const speed=calcSpeed(p1,p2,dt);

    await sendCommand(p2,speed);

    $("action").textContent=
      "アクション: "+
      (currentIndex+1)+
      " / "+
      actions.length+
      "  pos="+a.pos+
      " → piston="+p2+
      "  speed="+speed;

    currentIndex++;
  }

  updateUI();

  if(currentTime>=duration){
    currentTime=duration;
    playing=false;
    clearTimeout(timer);
    timer=null;
    updateUI();
    log("再生完了");
    return;
  }

  timer=setTimeout(playbackTick,10);
}

function play(){
  if(!characteristic){
    alert("先にVorzePistonへ接続してください。");
    return;
  }

  if(!actions.length){
    alert("先にFunscriptを選択してください。");
    return;
  }

  if(playing)return;

  if(currentTime>=duration){
    currentTime=0;
  }

  currentIndex=findIndexAtOrAfter(currentTime);

  playStartScript=currentTime;
  playStartWall=performance.now();

  playing=true;

  log("再生開始: "+fmt(currentTime));

  playbackTick();
}

function pause(){
  if(!playing)return;

  currentTime=
    playStartScript+
    (performance.now()-playStartWall);

  playing=false;

  clearTimeout(timer);
  timer=null;

  updateUI();

  log("一時停止: "+fmt(currentTime));
}

async function seekTo(t){
  const wasPlaying=playing;

  if(wasPlaying){
    pause();
  }

  currentTime=Math.max(0,Math.min(duration,Number(t)||0));

  currentIndex=findIndexAtOrAfter(currentTime);

  updateUI();

  log("シーク: "+fmt(currentTime));

  if(wasPlaying){
    play();
  }
}

async function stopPlayback(){
  playing=false;

  clearTimeout(timer);
  timer=null;

  currentTime=0;
  currentIndex=0;

  updateUI();

  if(characteristic){
    await sendCommand(0,100);
  }

  log("停止");
}

$("connect").onclick=connect;

$("file").onchange=async e=>{
  const file=e.target.files&&e.target.files[0];

  if(!file)return;

  try{
    const data=JSON.parse(await file.text());

    if(!Array.isArray(data.actions)){
      throw new Error("actionsがありません");
    }

    actions=data.actions
      .filter(a=>
        Number.isFinite(Number(a.at)) &&
        Number.isFinite(Number(a.pos))
      )
      .map(a=>({
        at:Number(a.at),
        pos:Math.max(0,Math.min(100,Number(a.pos)))
      }))
      .sort((a,b)=>a.at-b.at);

    if(!actions.length){
      throw new Error("有効なactionがありません");
    }

    duration=actions[actions.length-1].at;

    currentTime=0;
    currentIndex=0;

    $("info").textContent=
      "ファイル: "+file.name+
      "\nアクション数: "+actions.length+
      "\n再生時間: "+fmt(duration);

    updateUI();

    log("Funscript読み込み成功");
    log("アクション数: "+actions.length);
    log("最終時刻: "+duration+" ms");

  }catch(e){
    $("info").textContent="読み込み失敗";
    log("読み込みERROR: "+e.message);
  }
};

$("play").onclick=play;
$("pause").onclick=pause;
$("stop").onclick=stopPlayback;

$("back").onclick=()=>seekTo(currentTime-10000);
$("forward").onclick=()=>seekTo(currentTime+10000);

$("seek").onchange=()=>{
  seekTo(Number($("seek").value));
};

updateUI();
</script>
</body>
</html>
