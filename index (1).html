<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VorzePiston 接続テスト Step1</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    margin-top:50px;
}

button{
    font-size:20px;
    padding:15px 30px;
    cursor:pointer;
}

#log{
    width:90%;
    height:300px;
    margin:20px auto;
    border:1px solid #ccc;
    background:white;
    text-align:left;
    overflow:auto;
    padding:10px;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<h1>VorzePiston 接続テスト Step1</h1>

<button id="connect">
Bluetooth接続
</button>

<div id="log"></div>

<script>

const log = (text)=>{
    document.getElementById("log").textContent += text + "\n";
};

document.getElementById("connect").onclick = async ()=>{

    try{

        log("Bluetooth機器の選択を開始");

        const device = await navigator.bluetooth.requestDevice({

            filters:[
                {
                    name:"VorzePiston"
                }
            ],

            optionalServices:[]
        });

        log("選択された機器 : " + device.name);

        const server = await device.gatt.connect();

        log("GATT接続成功");

        log("Step1 完了");

    }
    catch(e){

        log("ERROR");

        log(e.name);

        log(e.message);

    }

}

</script>

</body>
</html>
